<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Premium Casino Wheel - ZONK</title>
<style>
body {
    margin:0; padding:0;
    background:#0a0a0a;
    font-family: 'Arial', sans-serif;
    color:#fff;
    text-align:center;
}
.container {
    margin-top:20px;
}
.wheel-container {
    position:relative;
    display:inline-block;
}
#wheel {
    border:15px solid #ffdd00;
    border-radius:50%;
    box-shadow: 0 0 30px #ffdd00, 0 0 60px #ffdd00, 0 0 90px #ffdd00 inset;
    transition: box-shadow 0.3s;
}
#wheel.glow {
    box-shadow: 0 0 50px #ffdd00, 0 0 100px #ffdd00, 0 0 150px #ffdd00 inset;
}
#spin-btn {
    margin-top:20px;
    padding:15px 40px;
    font-size:22px;
    font-weight:bold;
    background: linear-gradient(45deg, #ffdd00, #ff5500);
    color:black;
    border:none;
    border-radius:15px;
    cursor:pointer;
    text-shadow: 0 0 5px #fff;
    box-shadow: 0 0 20px #ffdd00, 0 0 40px #ff5500 inset;
    transition: all 0.3s;
}
#spin-btn:hover {
    transform:scale(1.1);
    box-shadow: 0 0 40px #ffdd00, 0 0 60px #ff5500 inset;
}
.history {
    margin-top:30px;
    text-align:left;
    display:inline-block;
    width:300px;
}
#history-list {
    list-style:none;
    padding:0;
    max-height:200px;
    overflow-y:auto;
    border:2px solid gold;
    border-radius:10px;
    padding:10px;
    background:#111;
}
#history-list li {
    margin-bottom:5px;
    padding:5px 10px;
    background:#222;
    border-radius:5px;
}
.confetti {
    position: fixed;
    width: 8px;
    height: 8px;
    opacity: 0.8;
    top: -10px;
    animation: fall 3s linear forwards;
    z-index: 9999;
}
@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(100vh) rotate(720deg); }
}
</style>
</head>
<body>

<div class="container">
    <h1>🎰 Premium Casino Wheel 🎰</h1>
    <div class="wheel-container">
        <canvas id="wheel" width="500" height="500"></canvas>
        <button id="spin-btn">SPIN!</button>
    </div>
    <div class="history">
        <h2>History Spin</h2>
        <ul id="history-list"></ul>
    </div>
</div>

<audio id="spin-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d60c3e5b8.mp3?filename=coin-spin-2-6911.mp3"></audio>
<audio id="win-sound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b73c7e4c2.mp3?filename=coin-win-6940.mp3"></audio>

<script>
const wheel = document.getElementById('wheel');
const ctx = wheel.getContext('2d');
const spinBtn = document.getElementById('spin-btn');
const spinSound = document.getElementById('spin-sound');
const winSound = document.getElementById('win-sound');
const historyList = document.getElementById('history-list');

let startAngle = 0;
let isSpinning = false;
let spinHistory = [];

// Semua hadiah tapi jarum selalu ke ZONK
const prizes = [
    "SCATTER GRATIS",
    "FREESPIN",
    "FREEBET",
    "HONDA SCOOPY 2025",
    "HONDA BRIO",
    "TUNAI 10.000.000",
    "ZONK",
];
const colors = [
    "#e74c3c", "#8e44ad", "#3498db", "#27ae60",
    "#f1c40f", "#d35400", "#2c3e50"
];

const size = prizes.length;
const arc = (2 * Math.PI) / size;

function drawWheel() {
    for (let i = 0; i < size; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.moveTo(250,250);
        ctx.arc(250,250,240,angle,angle+arc);
        ctx.lineTo(250,250);
        ctx.fill();
        ctx.save();
        ctx.translate(250 + Math.cos(angle+arc/2)*180, 250 + Math.sin(angle+arc/2)*180);
        ctx.rotate(angle + arc/2 + Math.PI/2);
        ctx.fillStyle="#fff";
        ctx.font="16px Arial";
        ctx.textAlign="center";
        ctx.fillText(prizes[i],0,0);
        ctx.restore();
    }
}
drawWheel();

function confetti() {
    const confettiCount = 150;
    for(let i=0;i<confettiCount;i++){
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left=Math.random()*window.innerWidth+"px";
        confetti.style.backgroundColor=colors[Math.floor(Math.random()*colors.length)];
        document.body.appendChild(confetti);
        setTimeout(()=>confetti.remove(),3000);
    }
}

// Efek neon / flicker tombol
setInterval(()=>{
    spinBtn.style.boxShadow=`0 0 ${Math.random()*50+20}px #ffdd00,0 0 ${Math.random()*60+20}px #ff5500 inset`;
    wheel.classList.toggle('glow');
},200);

spinBtn.addEventListener('click',()=>{
    if(isSpinning) return;
    isSpinning=true;
    spinSound.currentTime=0; spinSound.play();

    const spins=Math.floor(Math.random()*5000)+3000;
    const duration=5000;
    const start=performance.now();

    function animate(time){
        const elapsed=time-start;
        const progress=Math.min(elapsed/duration,1);
        const ease=1-Math.pow(1-progress,3);
        startAngle=(startAngle+ease*spins)%(2*Math.PI);
        ctx.clearRect(0,0,500,500);
        drawWheel();
        if(progress<1) requestAnimationFrame(animate);
        else{
            isSpinning=false;
            spinSound.pause();
            winSound.play();
            showResult();
        }
    }
    requestAnimationFrame(animate);
});

function showResult(){
    // Jarum selalu ke ZONK
    const prize = "ZONK";

    spinHistory.unshift(prize);
    if(spinHistory.length>10) spinHistory.pop();
    updateHistory();
    confetti();
    setTimeout(()=>alert("💀 ZONK! Better luck next time!"),200);
}

function updateHistory(){
    historyList.innerHTML='';
    spinHistory.forEach((item,i)=>{
        const li=document.createElement('li');
        li.textContent=`${spinHistory.length-i}. ${item}`;
        historyList.appendChild(li);
    });
}
</script>
</body>
</html>
